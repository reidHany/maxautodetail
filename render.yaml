services:
  - type: web
    name: maxautodetail
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: booking-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/bookings.sqlite
      - key: BUSINESS_TIME_ZONE
        value: America/Chicago
